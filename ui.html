<!-- ui.html - Plugin user interface -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, -apple-system, sans-serif; font-size: 12px; color: #333; padding: 16px; }
    h2 { font-size: 14px; margin-bottom: 4px; }
    .subtitle { font-size: 11px; color: #999; margin-bottom: 16px; }
    .drop-zone {
      border: 2px dashed #ccc; border-radius: 8px; padding: 24px; text-align: center;
      cursor: pointer; transition: border-color 0.2s; margin-bottom: 16px;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: #18A0FB; background: #f0f8ff; }
    .drop-zone input { display: none; }
    .drop-zone p { color: #999; font-size: 12px; }
    .file-list { max-height: 200px; overflow-y: auto; margin-bottom: 16px; }
    .file-item {
      display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 4px;
      background: #f5f5f5; margin-bottom: 4px;
    }
    .file-item .name { flex: 1; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .remove { cursor: pointer; color: #999; font-size: 16px; }
    .file-item .status { font-size: 10px; }
    .file-item .status.ready { color: #18A0FB; }
    .file-item .status.error { color: #F24822; }
    .preview-area {
      border: 1px solid #e5e5e5; border-radius: 4px; overflow: hidden; margin-bottom: 16px;
      min-height: 100px; background: #fafafa; display: flex; align-items: center; justify-content: center;
    }
    .preview-area iframe { border: none; transform: scale(0.35); transform-origin: top left; pointer-events: none; }
    .preview-area p { color: #ccc; font-size: 12px; }
    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 12px;
      font-weight: 600; cursor: pointer; margin-bottom: 8px;
    }
    .btn-primary { background: #18A0FB; color: #fff; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .progress { margin-bottom: 8px; font-size: 11px; color: #999; text-align: center; }
    .option-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 11px; }
    .option-row input[type="checkbox"] { margin-right: 4px; }
  </style>
</head>
<body>
  <h2>HTML to Figma</h2>
  <p class="subtitle">Convert HTML to Figma layers using absolute positioning</p>

  <div class="drop-zone" id="dropZone">
    <p>Click or drag .html files here</p>
    <input type="file" id="fileInput" accept=".html" multiple>
  </div>

  <div class="file-list" id="fileList"></div>

  <div class="preview-area" id="previewArea">
    <p>Select a file to preview</p>
  </div>

  <div class="option-row">
    <input type="checkbox" id="useFramesCb" checked>
    <label for="useFramesCb">Use Frames (build layer tree with constraints)</label>
  </div>

  <div class="progress" id="progress"></div>

  <button class="btn btn-primary" id="generateBtn" disabled>Generate in Figma</button>
  <button class="btn btn-secondary" id="extractBtn">Extract Canvas Info</button>
  <button class="btn btn-secondary" id="closeBtn">Close</button>

  <script>
  // --- htmlToFigma extractor (ported from BuilderIO/html-to-figma) ---
  // Runs inside the iframe context to extract DOM → Figma layers.
  (function () {
    // Disable animations for capture
    var ANIMATION_OVERRIDE = [
      '*,*::before,*::after{',
      'animation:none!important;',
      'animation-delay:0s!important;',
      'animation-duration:0s!important;',
      'animation-play-state:paused!important;',
      'transition:none!important;',
      'transition-delay:0s!important;',
      'transition-duration:0s!important;',
      'scroll-behavior:auto!important;',
      '}'
    ].join('');

    function stripAnimations(doc) {
      try {
        var style = doc.createElement('style');
        style.textContent = ANIMATION_OVERRIDE;
        doc.head.appendChild(style);
        Array.from(doc.querySelectorAll('details')).forEach(function(el) {
          el.setAttribute('open', '');
        });
      } catch(e) {}
    }

    function decodeImages(doc) {
      var images = Array.from(doc.images || []);
      images.forEach(function(img) {
        if (img.decoding !== 'sync') img.decoding = 'sync';
        if (img.loading !== 'eager') img.loading = 'eager';
      });
      return Promise.allSettled(images.map(function(img) {
        return img.decode ? img.decode() : Promise.resolve();
      }));
    }

    function makeWarning(code, message, severity) {
      return { code: code, message: message, severity: severity || 'warning' };
    }

    // --- bounding rect helpers ---
    function getDirectionMostOfElements(direction, elements) {
      if (elements.length === 1) return elements[0];
      return elements.reduce(function(memo, value) {
        if (!memo) return value;
        var memoRect = getBoundingClientRect(memo);
        var valRect = getBoundingClientRect(value);
        if (direction === 'left' || direction === 'top') {
          return valRect[direction] < memoRect[direction] ? value : memo;
        } else {
          return valRect[direction] > memoRect[direction] ? value : memo;
        }
      }, null);
    }

    function getAggregateRectOfElements(elements) {
      if (!elements.length) return null;
      var top = getBoundingClientRect(getDirectionMostOfElements('top', elements)).top;
      var left = getBoundingClientRect(getDirectionMostOfElements('left', elements)).left;
      var bottom = getBoundingClientRect(getDirectionMostOfElements('bottom', elements)).bottom;
      var right = getBoundingClientRect(getDirectionMostOfElements('right', elements)).right;
      return { top: top, left: left, bottom: bottom, right: right, width: right - left, height: bottom - top };
    }

    function getBoundingClientRect(el) {
      var computed = getComputedStyle(el);
      var display = computed.display;
      if (display && display.indexOf('inline') !== -1 && el.children.length) {
        var elRect = el.getBoundingClientRect();
        var aggregateRect = getAggregateRectOfElements(Array.from(el.children));
        if (aggregateRect) {
          if (elRect.width > aggregateRect.width) {
            return { top: aggregateRect.top, left: elRect.left, bottom: aggregateRect.bottom,
              right: elRect.right, width: elRect.width, height: aggregateRect.height };
          }
          return aggregateRect;
        }
      }
      var r = el.getBoundingClientRect();
      return { top: r.top, left: r.left, bottom: r.bottom, right: r.right, width: r.width, height: r.height };
    }

    function isHidden(element) {
      var el = element;
      do {
        var computed = getComputedStyle(el);
        if (computed.display === 'none' || computed.visibility === 'hidden') return true;
        if (computed.overflow !== 'visible' && el.getBoundingClientRect().height < 1) return true;
      } while ((el = el.parentElement));
      return false;
    }

    // --- gradient parser ---
    function parseColorStops(str) {
      var stops = [];
      var re = /(rgba?\([^)]+\)|hsla?\([^)]+\)|#[a-fA-F0-9]{3,8}|[a-z]+)\s*(\d+\.?\d*%?)?/gi;
      var m;
      while ((m = re.exec(str)) !== null) {
        var rgb = getRgb(m[1]);
        if (!rgb) continue;
        var posStr = m[2];
        var pos = posStr ? parseFloat(posStr) / (posStr.indexOf('%') !== -1 ? 100 : 1) : null;
        stops.push({ color: { r: rgb.r, g: rgb.g, b: rgb.b, a: rgb.a }, position: pos });
      }
      if (stops.length < 2) return null;
      fixTransparentGradientStops(stops);
      for (var i = 0; i < stops.length; i++) {
        if (stops[i].position == null) {
          stops[i].position = stops.length === 1 ? 0 : i / (stops.length - 1);
        }
        stops[i].position = Math.min(1, Math.max(0, stops[i].position));
      }
      return stops;
    }

    function fixTransparentGradientStops(stops) {
      for (var i = 0; i < stops.length; i++) {
        var stop = stops[i];
        if (!stop.color || stop.color.a !== 0) continue;

        var source = null;
        for (var p = i - 1; p >= 0; p--) {
          if (stops[p].color && stops[p].color.a !== 0) {
            source = stops[p].color;
            break;
          }
        }
        if (!source) {
          for (var n = i + 1; n < stops.length; n++) {
            if (stops[n].color && stops[n].color.a !== 0) {
              source = stops[n].color;
              break;
            }
          }
        }
        if (source) {
          stop.color.r = source.r;
          stop.color.g = source.g;
          stop.color.b = source.b;
        }
      }
    }

    function getGradientPrelude(str) {
      var open = str.indexOf('(');
      if (open === -1) return '';
      var depth = 0;
      for (var i = open + 1; i < str.length; i++) {
        var ch = str[i];
        if (ch === '(') depth++;
        else if (ch === ')') {
          if (depth === 0) break;
          depth--;
        } else if (ch === ',' && depth === 0) {
          return str.slice(open + 1, i).trim();
        }
      }
      return '';
    }

    function parsePositionToken(token, axis, fallback) {
      if (!token) return fallback;
      token = token.toLowerCase();
      if (token === 'center') return 0.5;
      if (axis === 'x') {
        if (token === 'left') return 0;
        if (token === 'right') return 1;
      } else {
        if (token === 'top') return 0;
        if (token === 'bottom') return 1;
      }
      if (token.indexOf('%') !== -1) return parseFloat(token) / 100;
      if (token === '0' || token === '0px') return 0;
      return fallback;
    }

    function parseRadialCenter(prelude) {
      var center = { x: 0.5, y: 0.5 };
      var atMatch = prelude.match(/\bat\b\s+(.+)$/i);
      if (!atMatch) return center;

      var tokens = atMatch[1].trim().split(/\s+/).filter(Boolean);
      if (!tokens.length) return center;
      if (tokens.length === 1) {
        var only = tokens[0].toLowerCase();
        if (only === 'top' || only === 'bottom') center.y = parsePositionToken(only, 'y', 0.5);
        else center.x = parsePositionToken(only, 'x', 0.5);
        return center;
      }

      var first = tokens[0].toLowerCase();
      var second = tokens[1].toLowerCase();
      if (first === 'top' || first === 'bottom') {
        center.y = parsePositionToken(first, 'y', 0.5);
        center.x = parsePositionToken(second, 'x', 0.5);
      } else if (first === 'left' || first === 'right') {
        center.x = parsePositionToken(first, 'x', 0.5);
        center.y = parsePositionToken(second, 'y', 0.5);
      } else {
        center.x = parsePositionToken(first, 'x', 0.5);
        center.y = parsePositionToken(second, 'y', 0.5);
      }
      center.x = Math.min(1, Math.max(0, center.x));
      center.y = Math.min(1, Math.max(0, center.y));
      return center;
    }

    function parseExplicitRadialSize(sizePart, center) {
      var tokens = sizePart.replace(/\b(circle|ellipse)\b/gi, '').trim().split(/\s+/).filter(Boolean);
      var values = tokens.filter(function(token) { return token.indexOf('%') !== -1 || token === '0' || token === '0px'; });
      if (!values.length) return null;
      var rx = parsePositionToken(values[0], 'x', null);
      var ry = values.length > 1 ? parsePositionToken(values[1], 'y', null) : rx;
      if (rx == null || ry == null) return null;
      return { x: Math.max(0.0001, rx), y: Math.max(0.0001, ry) };
    }

    function radialRadiiFromSize(sizePart, center) {
      var explicit = parseExplicitRadialSize(sizePart, center);
      if (explicit) return explicit;

      var lower = sizePart.toLowerCase();
      var shapeCircle = lower.indexOf('circle') !== -1;
      var sizeKeyword = 'farthest-corner';
      if (lower.indexOf('closest-side') !== -1) sizeKeyword = 'closest-side';
      else if (lower.indexOf('farthest-side') !== -1) sizeKeyword = 'farthest-side';
      else if (lower.indexOf('closest-corner') !== -1) sizeKeyword = 'closest-corner';

      var nearX = Math.min(center.x, 1 - center.x);
      var farX = Math.max(center.x, 1 - center.x);
      var nearY = Math.min(center.y, 1 - center.y);
      var farY = Math.max(center.y, 1 - center.y);
      var rx;
      var ry;
      if (shapeCircle) {
        var radius;
        if (sizeKeyword === 'closest-side') radius = Math.min(nearX, nearY);
        else if (sizeKeyword === 'farthest-side') radius = Math.max(farX, farY);
        else if (sizeKeyword === 'closest-corner') radius = Math.sqrt(nearX * nearX + nearY * nearY);
        else radius = Math.sqrt(farX * farX + farY * farY);
        rx = radius;
        ry = radius;
      } else if (sizeKeyword === 'closest-side') {
        rx = nearX;
        ry = nearY;
      } else if (sizeKeyword === 'farthest-side') {
        rx = farX;
        ry = farY;
      } else if (sizeKeyword === 'closest-corner') {
        rx = Math.SQRT2 * nearX;
        ry = Math.SQRT2 * nearY;
      } else {
        rx = Math.SQRT2 * farX;
        ry = Math.SQRT2 * farY;
      }
      return { x: Math.max(0.0001, rx), y: Math.max(0.0001, ry) };
    }

    function radialGradientTransform(str) {
      var prelude = getGradientPrelude(str);
      if (prelude && prelude.search(/\bat\b/i) === -1 && /^(rgba?\(|hsla?\(|#[a-fA-F0-9]|transparent\b)/i.test(prelude.trim())) {
        prelude = '';
      }
      var center = parseRadialCenter(prelude);
      var atIndex = prelude.search(/\bat\b/i);
      var sizePart = atIndex === -1 ? prelude : prelude.slice(0, atIndex);
      var radii = radialRadiiFromSize(sizePart, center);
      var sx = 0.5 / radii.x;
      var sy = 0.5 / radii.y;
      return [
        [sx, 0, 0.5 - center.x * sx],
        [0, sy, 0.5 - center.y * sy]
      ];
    }

    function parseGradient(str) {
      if (!str || str === 'none') return null;
      if (str.indexOf('linear-gradient') !== -1) {
        var s = parseColorStops(str); if (!s) return null;
        var am = str.match(/(\d+\.?\d*)deg/); var angle = am ? parseFloat(am[1]) % 360 : 180;
        var rad = (angle - 90) * Math.PI / 180; var cos = Math.cos(rad), sin = Math.sin(rad);
        return { type: 'GRADIENT_LINEAR', gradientStops: s, gradientTransform: [[cos, sin, 0.5 - cos * 0.5 - sin * 0.5], [-sin, cos, 0.5 + sin * 0.5 - cos * 0.5]], visible: true };
      }
      if (str.indexOf('radial-gradient') !== -1) {
        var s2 = parseColorStops(str); return s2 ? { type: 'GRADIENT_RADIAL', gradientStops: s2, gradientTransform: radialGradientTransform(str), visible: true } : null;
      }
      if (str.indexOf('conic-gradient') !== -1) {
        var s3 = parseColorStops(str); return s3 ? { type: 'GRADIENT_ANGULAR', gradientStops: s3, gradientTransform: [[1, 0, 0], [0, 1, 0]], visible: true } : null;
      }
      return null;
    }

    function splitCssLayers(value) {
      var layers = [];
      var depth = 0;
      var quote = '';
      var start = 0;
      for (var i = 0; i < value.length; i++) {
        var ch = value[i];
        if (quote) {
          if (ch === quote && value[i - 1] !== '\\') quote = '';
          continue;
        }
        if (ch === '"' || ch === "'") {
          quote = ch;
          continue;
        }
        if (ch === '(') depth++;
        else if (ch === ')') depth = Math.max(0, depth - 1);
        else if (ch === ',' && depth === 0) {
          layers.push(value.slice(start, i).trim());
          start = i + 1;
        }
      }
      var tail = value.slice(start).trim();
      if (tail) layers.push(tail);
      return layers;
    }

    function buildBackgroundFills(computedStyle, warnings, context) {
      var fills = [];
      var bg = getRgb(computedStyle.backgroundColor);
      if (isVisibleColor(bg)) {
        fills.push(solidPaintFromColor(bg));
      }
      if (computedStyle.backgroundImage && computedStyle.backgroundImage !== 'none') {
        splitCssLayers(computedStyle.backgroundImage).forEach(function(layer) {
          var gradient = parseGradient(layer);
          if (gradient) {
            fills.push(gradient);
            return;
          }
          var urlMatch = layer.match(/url\(['"]?(.*?)['"]?\)/);
          if (urlMatch && urlMatch[1]) {
            fills.push({ url: urlMatch[1], type: 'IMAGE', scaleMode: computedStyle.backgroundSize === 'contain' ? 'FIT' : 'FILL', imageHash: null });
            return;
          }
          if (warnings) {
            warnings.push(makeWarning('UNSUPPORTED_BACKGROUND_LAYER', 'Could not map background layer on ' + context + ': ' + layer, 'info'));
          }
        });
      }
      return fills;
    }

    function isVisibleColor(rgb) {
      return !!rgb && rgb.a !== 0;
    }

    function solidPaintFromColor(rgb) {
      return { type: 'SOLID', color: { r: rgb.r, g: rgb.g, b: rgb.b }, opacity: rgb.a == null ? 1 : rgb.a };
    }

    function hasTextClippedBackground(computedStyle) {
      var clip = computedStyle.backgroundClip || computedStyle.webkitBackgroundClip || '';
      var textFill = computedStyle.webkitTextFillColor || '';
      return clip.indexOf('text') !== -1 || textFill === 'transparent' || textFill === 'rgba(0, 0, 0, 0)';
    }

    // --- color parser ---
    function getRgb(colorString) {
      if (!colorString) return null;
      if (colorString === 'transparent') return { r: 0, g: 0, b: 0, a: 0 };
      if (colorString[0] === '#') {
        var hex = colorString.slice(1);
        if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
        return {
          r: parseInt(hex.substring(0, 2), 16) / 255,
          g: parseInt(hex.substring(2, 4), 16) / 255,
          b: parseInt(hex.substring(4, 6), 16) / 255,
          a: hex.length === 8 ? parseInt(hex.substring(6, 8), 16) / 255 : 1
        };
      }
      // New CSS: rgb(1 86 240) or rgba(1 86 240 / 0.5)
      var m = colorString.match(/rgba?\(([\d\.]+)\s+([\d\.]+)\s+([\d\.]+)\s*(?:\/\s*([\d\.]+))?\)/);
      if (m) {
        var a = m[4] !== undefined ? parseFloat(m[4]) : 1;
        return { r: parseInt(m[1]) / 255, g: parseInt(m[2]) / 255, b: parseInt(m[3]) / 255, a: a };
      }
      // Legacy CSS: rgb(1, 86, 240) or rgba(1, 86, 240, 0.5)
      var old = colorString.match(/rgba?\(([\d\.]+),\s*([\d\.]+),\s*([\d\.]+)(?:,\s*([\d\.]+))?\)/);
      if (!old) return null;
      var r = old[1], g = old[2], b = old[3], a2 = old[4];
      if (r && g && b) {
        return { r: parseInt(r) / 255, g: parseInt(g) / 255, b: parseInt(b) / 255, a: a2 ? parseFloat(a2) : 1 };
      }
      return null;
    }

    function parseUnits(str) {
      if (!str) return null;
      var match = str.match(/([\d\.]+)px/);
      if (match && match[1]) return { unit: 'PIXELS', value: parseFloat(match[1]) };
      return null;
    }

    function parseRadius(str, w, h) {
      if (!str) return null;
      var pxMatch = str.match(/([\d\.]+)px/);
      if (pxMatch) return parseFloat(pxMatch[1]);
      var pctMatch = str.match(/([\d\.]+)%/);
      if (pctMatch) return Math.round(Math.min(w, h) * parseFloat(pctMatch[1]) / 100);
      return null;
    }

    function getUrl(url) {
      if (!url) return '';
      var final = url.trim();
      if (final.indexOf('//') === 0) final = 'https:' + final;
      if (final.indexOf('/') === 0) final = 'https://' + location.host + final;
      return final;
    }

    // --- style extraction ---
    function getAppliedComputedStyles(element) {
      // nodeType 1 = ELEMENT_NODE (works cross-frame, unlike instanceof)
      if (!element || element.nodeType !== 1) return {};
      var styles = getComputedStyle(element);
      var list = ['opacity','backgroundColor','border','borderTop','borderLeft','borderRight','borderBottom',
        'borderRadius','backgroundImage','borderColor','boxShadow'];
      var color = styles.color;
      var defaults = {
        transform: 'none', opacity: '1', borderRadius: '0px', backgroundImage: 'none',
        backgroundColor: 'rgba(0, 0, 0, 0)', boxShadow: 'none',
        border: '0px none ' + color,
        borderTop: '0px none ' + color, borderBottom: '0px none ' + color,
        borderLeft: '0px none ' + color, borderRight: '0px none ' + color,
        borderWidth: '0px', borderColor: color, borderStyle: 'none'
      };
      var result = {};
      for (var i = 0; i < list.length; i++) {
        var key = list[i];
        if (styles[key] && styles[key] !== defaults[key]) {
          result[key] = styles[key];
        }
      }
      return result;
    }

    function size(obj) { return Object.keys(obj).length; }

    // --- text extraction ---
    function textNodesUnder(el) {
      var n, a = [];
      var walk = el.ownerDocument.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
      while ((n = walk.nextNode())) a.push(n);
      return a;
    }

    // --- fast clone ---
    function fastClone(data) {
      return typeof data === 'symbol' ? null : JSON.parse(JSON.stringify(data));
    }

    function parsePseudoContent(el, pseudoStyle) {
      var content = pseudoStyle.content;
      if (!content || content === 'none' || content === 'normal') return '';
      var attrMatch = content.match(/^attr\(([^)]+)\)$/);
      if (attrMatch) return el.getAttribute(attrMatch[1].trim()) || '';
      if ((content[0] === '"' && content[content.length - 1] === '"') ||
          (content[0] === "'" && content[content.length - 1] === "'")) {
        return content.slice(1, -1).replace(/\\"/g, '"').replace(/\\'/g, "'");
      }
      return content;
    }

    function appendPseudoTextLayer(layers, el, pseudo) {
      var style = getComputedStyle(el, pseudo);
      var text = parsePseudoContent(el, style);
      if (!text.trim()) return;
      var hostRect = getBoundingClientRect(el);
      var fontSize = parseUnits(style.fontSize);
      var lineHeight = parseUnits(style.lineHeight) || (fontSize ? { unit: 'PIXELS', value: Math.round(fontSize.value * 1.2) } : { unit: 'PIXELS', value: 12 });
      var width = Math.max(hostRect.width, text.length * ((fontSize && fontSize.value) || 10) * 0.62);
      var x = hostRect.left;
      var y = pseudo === '::before' ? hostRect.top - lineHeight.value - 2 : hostRect.bottom + 2;
      var left = parseUnits(style.left);
      var top = parseUnits(style.top);
      var bottom = parseUnits(style.bottom);
      if (left) x = hostRect.left + left.value;
      if (top) y = hostRect.top + top.value;
      else if (bottom) y = hostRect.bottom - bottom.value - lineHeight.value;
      if ((style.transform || '').indexOf('matrix') !== -1 && (style.left || '').indexOf('50%') !== -1) {
        x = hostRect.left + hostRect.width / 2 - width / 2;
      }
      var rgb = getRgb(style.color);
      var textLayer = {
        type: 'TEXT',
        ref: el,
        name: pseudoLayerName(el, pseudo),
        x: Math.round(x),
        y: Math.round(y),
        width: Math.round(width),
        height: Math.round(lineHeight.value),
        characters: text,
        lineHeight: lineHeight,
        isPseudoElement: true,
        _pseudo: pseudo,
        _pseudoZIndex: isNaN(parseInt(style.zIndex, 10)) ? null : parseInt(style.zIndex, 10)
      };

      // Collect TEXT indices to replace
      var toRemove = [];
      var toAdd = [];

      blockGroups.forEach(function(group, ancestor) {
        if (group.length < 2) return;

        // Sort by document position
        group.sort(function(a, b) {
          if (!a.layer.ref || !b.layer.ref) return 0;
          var pos = a.layer.ref.compareDocumentPosition(b.layer.ref);
          if (pos & Node.DOCUMENT_POSITION_FOLLOWING) return -1;
          if (pos & Node.DOCUMENT_POSITION_PRECEDING) return 1;
          return 0;
        });

        var firstRef = group[0].layer.ref;
        var lastRef = group[group.length - 1].layer.ref;
        if (!firstRef || !lastRef) return;

        try {
          var range = firstRef.ownerDocument.createRange();
          range.setStartBefore(firstRef);
          range.setEndAfter(lastRef);
          var rect = range.getBoundingClientRect();
          range.detach();

          // Concatenate characters
          var mergedChars = '';
          for (var i = 0; i < group.length; i++) {
            mergedChars += group[i].layer.characters;
          }

          // Use styles from the first TEXT layer
          var base = group[0].layer;
          var merged = {
            type: 'TEXT',
            x: Math.round(rect.left),
            y: Math.round(rect.top),
            width: Math.round(rect.width),
            height: Math.round(rect.height),
            characters: mergedChars,
            fills: base.fills,
            fontSize: base.fontSize,
            fontFamily: base.fontFamily,
            fontWeight: base.fontWeight,
            lineHeight: base.lineHeight,
            letterSpacing: base.letterSpacing,
            textAlignHorizontal: base.textAlignHorizontal,
            textDecoration: base.textDecoration,
            textCase: base.textCase,
            opacity: base.opacity,
            ref: firstRef
          };

          toAdd.push(merged);
          for (var i = 0; i < group.length; i++) {
            toRemove.push(group[i].index);
          }
        } catch (e) {}
      });

      // Rebuild layers: remove merged TEXT, append combined TEXT at end.
      // makeTree will correctly place them via DOM-based restructuring.
      if (toRemove.length === 0) return;
      var removeSet = {};
      for (var i = 0; i < toRemove.length; i++) removeSet[toRemove[i]] = true;
      var newLayers = [];
      for (var i = 0; i < layers.length; i++) {
        if (!removeSet[i]) newLayers.push(layers[i]);
      }
      for (var i = 0; i < toAdd.length; i++) {
        newLayers.push(toAdd[i]);
      }
      layers.length = 0;
      for (var i = 0; i < newLayers.length; i++) {
        layers.push(newLayers[i]);
      }
    }

    // --- removeRefs ---
    function removeRefs(layers) {
      layers.forEach(function(layer) {
        traverse(layer, function(child) {
          delete child.ref;
          delete child._pseudo;
          delete child._pseudoZIndex;
          delete child._isElementBackground;
        });
      });
    }

    // --- htmlToFigma main function ---
    // rootElement = container element (body), doc = iframe document, win = iframe window
    // Returns an array of LayerNode objects.
    function htmlToFigma(rootElement, options, doc, win) {
      doc = doc || document;
      win = win || window;
      var useFrames = options && options.useFrames;
      var warnings = (options && options.warnings) || [];
      var layers = [];
      var el = rootElement || doc.body;

      // Resolve SVG <use> elements
      Array.from(el.querySelectorAll('use')).forEach(function(use) {
        try {
          var symbolSelector = use.href.baseVal;
          var symbol = doc.querySelector(symbolSelector);
          if (symbol) use.outerHTML = symbol.innerHTML;
        } catch(err) {}
      });

      // Shadow DOM support
      var getShadowEls = function(root) {
        var result = [];
        if (!root.shadowRoot) return result;
        Array.from(root.shadowRoot.querySelectorAll('*')).forEach(function(sEl) {
          result.push(sEl);
          result = result.concat(getShadowEls(sEl));
        });
        return result;
      };

      var els = [];
      Array.from(el.querySelectorAll('*')).forEach(function(e) {
        els.push(e);
        els = els.concat(getShadowEls(e));
      });

      // Process each element
      els.forEach(function(el) {
        if (isHidden(el)) return;

        // Full SVG element (tagName is lowercase 'svg' for SVG elements)
        if (el.tagName === 'svg') {
          var svgRect = el.getBoundingClientRect();
          layers.push({
            type: 'SVG', ref: el, svg: el.outerHTML,
            x: Math.round(svgRect.left), y: Math.round(svgRect.top),
            width: Math.round(svgRect.width), height: Math.round(svgRect.height)
          });
          return;
        }

        // Child SVG element (skip) - check namespaceURI for cross-frame compat
        if (el.namespaceURI === 'http://www.w3.org/2000/svg') return;

        // Skip elements inside <picture>
        if (el.parentElement && el.parentElement.tagName === 'PICTURE') return;

        var appliedStyles = getAppliedComputedStyles(el);
        var computedStyle = getComputedStyle(el);
        var isTextGradientElement = hasTextClippedBackground(computedStyle);
        var pseudoLayers = [];
        appendPseudoBoxLayer(pseudoLayers, el, '::before', warnings);
        appendPseudoTextLayer(pseudoLayers, el, '::before');
        appendPseudoBoxLayer(pseudoLayers, el, '::after', warnings);
        appendPseudoTextLayer(pseudoLayers, el, '::after');

        if (!(size(appliedStyles) || el.tagName === 'IMG' ||
            el.tagName === 'PICTURE' || el.tagName === 'VIDEO')) {
          pseudoLayers.forEach(function(layer) { layers.push(layer); });
          return;
        }
        if (computedStyle.display === 'none') return;

        var rect = getBoundingClientRect(el);

        if (el.tagName === 'IMG') {
          var parent = el.parentElement;
          if (parent) {
            var pr = parent.getBoundingClientRect();
            rect.width = Math.round(pr.width);
            rect.height = Math.round(pr.width);
          }
        }

        if (rect.width < 1 || rect.height < 1) return;

        var fills = isTextGradientElement ? [] : buildBackgroundFills(computedStyle, warnings, el.tagName.toLowerCase());

        var rectNode = {
          type: 'RECTANGLE', ref: el,
          x: Math.round(rect.left), y: Math.round(rect.top),
          width: Math.round(rect.width), height: Math.round(rect.height),
          fills: fills,
          _isElementBackground: true
        };

        // Uniform border
        if (computedStyle.border) {
          var parsed = computedStyle.border.match(/^([\d\.]+)px\s*(\w+)\s*(.*)$/);
          if (parsed) {
            var bWidth = parsed[1], bType = parsed[2], bColor = parsed[3];
            if (bWidth && bWidth !== '0' && bType !== 'none' && bColor) {
              var rgb = getRgb(bColor);
              if (isVisibleColor(rgb)) {
                rectNode.strokes = [solidPaintFromColor(rgb)];
                rectNode.strokeWeight = Math.round(parseFloat(bWidth));
              }
            }
          }
        }

        // Non-uniform borders - create individual side rectangles
        if (!rectNode.strokes) {
          var directions = ['top', 'left', 'right', 'bottom'];
          for (var di = 0; di < directions.length; di++) {
            var dir = directions[di];
            var cap = dir[0].toUpperCase() + dir.substring(1);
            var dirComputed = computedStyle['border' + cap];
            if (dirComputed) {
              var dp = dirComputed.match(/^([\d\.]+)px\s*(\w+)\s*(.*)$/);
              if (dp) {
                var dbw = dp[1], dbt = dp[2], dbc = dp[3];
                if (dbw && dbw !== '0' && dbt !== 'none' && dbc) {
                  var drgb = getRgb(dbc);
                  if (isVisibleColor(drgb)) {
                    var bw = parseFloat(dbw);
                    var sideWidth = (dir === 'top' || dir === 'bottom') ? rect.width : bw;
                    var sideHeight = (dir === 'left' || dir === 'right') ? rect.height : bw;
                    var sideX = dir === 'right' ? rect.right - bw : rect.left;
                    var sideY = dir === 'bottom' ? rect.bottom - bw : rect.top;
                    layers.push({
                      ref: el, type: 'RECTANGLE',
                      x: sideX, y: sideY, width: sideWidth, height: sideHeight,
                      fills: [solidPaintFromColor(drgb)]
                    });
                  }
                }
              }
            }
          }
        }

        // <img> elements
        if (el.tagName === 'IMG' && el.src) {
          fills.push({ url: el.src, type: 'IMAGE', scaleMode: computedStyle.objectFit === 'contain' ? 'FIT' : 'FILL', imageHash: null });
        }

        // <picture> elements
        if (el.tagName === 'PICTURE') {
          var firstSource = el.querySelector('source');
          if (firstSource) {
            var src = firstSource.srcset && firstSource.srcset.split(/[,\s]+/g)[0];
            if (src) {
              fills.push({ url: getUrl(src), type: 'IMAGE', scaleMode: computedStyle.objectFit === 'contain' ? 'FIT' : 'FILL', imageHash: null });
            }
          }
        }

        // <video> elements
        if (el.tagName === 'VIDEO' && el.poster) {
          fills.push({ url: el.poster, type: 'IMAGE', scaleMode: computedStyle.objectFit === 'contain' ? 'FIT' : 'FILL', imageHash: null });
        }

        var effects = parseBoxShadowEffects(computedStyle.boxShadow);
        var blurEffect = parseBackdropBlurEffect(computedStyle, warnings);
        if (blurEffect) effects.push(blurEffect);
        if (effects.length) rectNode.effects = effects;

        // Border radius (4 corners)
        var btlr = parseRadius(computedStyle.borderTopLeftRadius, rect.width, rect.height);
        if (btlr) rectNode.topLeftRadius = btlr;
        var btrr = parseRadius(computedStyle.borderTopRightRadius, rect.width, rect.height);
        if (btrr) rectNode.topRightRadius = btrr;
        var bbrr = parseRadius(computedStyle.borderBottomRightRadius, rect.width, rect.height);
        if (bbrr) rectNode.bottomRightRadius = bbrr;
        var bblr = parseRadius(computedStyle.borderBottomLeftRadius, rect.width, rect.height);
        if (bblr) rectNode.bottomLeftRadius = bblr;
        if (!btlr && !btrr && !bbrr && !bblr) {
          var br = parseRadius(computedStyle.borderRadius, rect.width, rect.height);
          if (br) rectNode.topLeftRadius = rectNode.topRightRadius = rectNode.bottomRightRadius = rectNode.bottomLeftRadius = br;
        }

        rectNode.fills = fills;
        layers.push(rectNode);
        pseudoLayers.forEach(function(layer) { layers.push(layer); });
      });

      // --- Text nodes ---
      var textNodes = textNodesUnder(el);
      for (var ti = 0; ti < textNodes.length; ti++) {
        var node = textNodes[ti];
        if (!node.textContent || !node.textContent.trim().length) continue;
        var parent = node.parentElement;
        if (!parent || isHidden(parent)) continue;

        var pComputed = getComputedStyle(parent);
        var range = parent.ownerDocument.createRange();
        range.selectNode(node);
        var tRect = fastClone(range.getBoundingClientRect());
        var lh = parseUnits(pComputed.lineHeight);
        if (!lh && pComputed.lineHeight === 'normal') {
          var fs = parseUnits(pComputed.fontSize);
          if (fs) {
            lh = { unit: 'PIXELS', value: Math.round(fs.value * 1.2) };
          }
        }
        range.detach();

        if (lh && tRect.height < lh.value) {
          var delta = lh.value - tRect.height;
          tRect.top -= delta / 2;
          tRect.height = lh.value;
        }
        if (tRect.height < 1 || tRect.width < 1) continue;

        var textNode = {
          x: Math.round(tRect.left), ref: node,
          y: Math.round(tRect.top),
          width: Math.round(tRect.width), height: Math.round(tRect.height),
          type: 'TEXT',
          characters: node.textContent.trim().replace(/\s+/g, ' ')
        };

        var tFills = [];
        if (hasTextClippedBackground(pComputed) && pComputed.backgroundImage && pComputed.backgroundImage !== 'none') {
          splitCssLayers(pComputed.backgroundImage).some(function(layer) {
            var gradient = parseGradient(layer);
            if (gradient) {
              tFills.push(gradient);
              return true;
            }
            return false;
          });
        }
        if (!tFills.length) {
          var tRgb = getRgb(pComputed.color);
          if (isVisibleColor(tRgb)) {
            tFills.push(solidPaintFromColor(tRgb));
          }
        }
        if (tFills.length) textNode.fills = tFills;

        var ls = parseUnits(pComputed.letterSpacing);
        if (ls) textNode.letterSpacing = ls;
        if (lh) textNode.lineHeight = lh;

        var textTransform = pComputed.textTransform;
        if (textTransform === 'uppercase') textNode.textCase = 'UPPER';
        else if (textTransform === 'lowercase') textNode.textCase = 'LOWER';
        else if (textTransform === 'capitalize') textNode.textCase = 'TITLE';

        var fs = parseUnits(pComputed.fontSize);
        if (fs) textNode.fontSize = Math.round(fs.value);

        if (pComputed.fontFamily) textNode.fontFamily = pComputed.fontFamily;
        if (pComputed.fontStyle) textNode.fontStyle = pComputed.fontStyle;
        if (pComputed.fontWeight) textNode.fontWeight = parseFloat(pComputed.fontWeight) || undefined;

        if (pComputed.textDecoration === 'underline' || pComputed.textDecoration === 'strikethrough') {
          textNode.textDecoration = pComputed.textDecoration.toUpperCase();
        }

        var ta = pComputed.textAlign;
        if (ta === 'left' || ta === 'center' || ta === 'right' || ta === 'justified') {
          textNode.textAlignHorizontal = ta.toUpperCase();
        }

        layers.push(textNode);
      }

      // Merge adjacent TEXT fragments from inline tags into single TEXT nodes
      mergeAdjacentText(layers, el);

      // Root frame
      var root = {
        type: 'FRAME',
        width: Math.round(win.innerWidth),
        height: Math.round(doc.documentElement.scrollHeight),
        x: 0, y: 0, ref: doc.body
      };
      var rootComputed = getComputedStyle(doc.body || doc.documentElement);
      var rootFills = buildBackgroundFills(rootComputed, warnings, 'body');
      if (rootFills.length) root.fills = rootFills;

      // Build tree or return flat
      if (useFrames) {
        var refMap = new WeakMap();
        layers.forEach(function(layer) {
          if (layer.ref && !layer.isPseudoElement) refMap.set(layer.ref, layer);
        });
        root.children = layers.slice();
        makeTree(root, layers, refMap, doc);
        sortPseudoLayers(root);
        addConstraints([root]);
        inferAutoLayout([root], warnings);
        removeRefs([root]);
        return [root];
      }

      layers.unshift(root);
      removeRefs(layers);
      return layers;
    }

    // --- extractFromHtml wrapper (iframe-based extraction) ---
    // Runs htmlToFigma directly from parent context, passing iframe's doc/window.
    // getComputedStyle() and getBoundingClientRect() work on iframe elements from parent context.
    window.HtmlExtractor = {
      extractFromHtml: function(html) {
        return new Promise(function(resolve, reject) {
          // Strip external resource links before loading to avoid CSP violations
          var cleanHtml = html
            .replace(/<link[^>]*href=["']https?:\/\/[^"']*["'][^>]*\/?>/gi, '')
            .replace(/@import\s+url\(['"]?https?:\/\/[^'")\s]*['"]?\)/gi, '');

          var iframe = document.createElement('iframe');
          iframe.style.cssText = 'position:absolute;left:-9999px;width:1440px;height:900px;border:none;';
          document.body.appendChild(iframe);

          iframe.onload = function() {
            try {
              var idoc = iframe.contentDocument || iframe.contentWindow.document;
              var iwin = iframe.contentWindow || iframe.contentWindow;
              var warnings = [];
              stripAnimations(idoc);

              decodeImages(idoc).catch(function(err) {
                warnings.push(makeWarning('IMAGE_DECODE_FAILED', String(err), 'info'));
              }).then(function() {
                requestAnimationFrame(function() {
                try {
                  var body = idoc.body || idoc.documentElement;
                  // Call htmlToFigma directly, with iframe's document/window
                  var result = htmlToFigma(body, { useFrames: window._useFrames !== false, warnings: warnings }, idoc, iwin);
                  var payload = {
                    version: 1,
                    source: 'local-html',
                    title: idoc.title || undefined,
                    layers: result,
                    viewportRect: {
                      x: 0,
                      y: 0,
                      width: Math.round(iwin.innerWidth),
                      height: Math.round(iwin.innerHeight)
                    },
                    documentRect: {
                      x: 0,
                      y: 0,
                      width: Math.round(idoc.documentElement.scrollWidth),
                      height: Math.round(idoc.documentElement.scrollHeight)
                    },
                    devicePixelRatio: iwin.devicePixelRatio || 1,
                    warnings: warnings
                  };
                  document.body.removeChild(iframe);
                  console.log('[Extractor] Layers extracted:', result.length);
                  resolve(payload);
                } catch(e) {
                  document.body.removeChild(iframe);
                  console.error('[Extractor] Error:', e);
                  reject(e);
                }
                });
              });
            } catch(e) {
              document.body.removeChild(iframe);
              reject(e);
            }
          };

          iframe.onerror = function() {
            document.body.removeChild(iframe);
            reject(new Error('Failed to load HTML'));
          };

          iframe.srcdoc = cleanHtml;
        });
      }
    };
  })();

  // --- UI Logic ---
  var files = [];
  var extractedData = {};
  var selectedIndex = -1;
  window._useFrames = true; // default to frame tree mode

  var dropZone = document.getElementById('dropZone');
  var fileInput = document.getElementById('fileInput');
  var fileList = document.getElementById('fileList');
  var previewArea = document.getElementById('previewArea');
  var progressEl = document.getElementById('progress');
  var generateBtn = document.getElementById('generateBtn');
  var closeBtn = document.getElementById('closeBtn');
  var useFramesCb = document.getElementById('useFramesCb');

  useFramesCb.addEventListener('change', function() { window._useFrames = useFramesCb.checked; });

  dropZone.addEventListener('click', function() { fileInput.click(); });
  dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', function(e) {
    e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', function() { handleFiles(fileInput.files); });

  function handleFiles(fileList) {
    for (var i = 0; i < fileList.length; i++) {
      var file = fileList[i];
      if (!file.name.endsWith('.html')) continue;
      files.push(file);
      addFileToList(file);
      extractFile(file);
    }
    fileInput.value = '';
  }

  function addFileToList(file) {
    var idx = files.length - 1;
    var item = document.createElement('div');
    item.className = 'file-item';
    item.id = 'file-' + idx;
    item.innerHTML = '<span class="name">' + file.name + '</span><span class="status" id="status-' + idx + '">Extracting...</span><span class="remove" id="remove-' + idx + '">&times;</span>';
    item.addEventListener('click', function() { selectFile(idx); });
    fileList.appendChild(item);
    document.getElementById('remove-' + idx).addEventListener('click', function(e) { e.stopPropagation(); removeFile(idx); });
  }

  function extractFile(file) {
    var idx = files.indexOf(file);
    var reader = new FileReader();
    reader.onload = function(e) {
      window.HtmlExtractor.extractFromHtml(e.target.result).then(function(data) {
        extractedData[idx] = data;
        var statusEl = document.getElementById('status-' + idx);
        if (statusEl) {
          statusEl.textContent = data.layers.length + ' layers';
          statusEl.className = 'status ready';
        }
      }).catch(function(err) {
        var statusEl = document.getElementById('status-' + idx);
        if (statusEl) { statusEl.textContent = 'Failed'; statusEl.className = 'status error'; }
        console.error(err);
      });
    };
    reader.readAsText(file);
  }

  function selectFile(idx) {
    selectedIndex = idx;
    document.querySelectorAll('.file-item').forEach(function(el) { el.style.background = '#f5f5f5'; });
    var el = document.getElementById('file-' + idx);
    if (el) el.style.background = '#e0f0ff';
    generateBtn.disabled = false;
    if (files[idx]) {
      var file = files[idx];
      var reader = new FileReader();
      reader.onload = function(e) {
        previewArea.innerHTML = '<iframe width="1440" height="900" srcdoc="' +
          e.target.result.replace(/"/g, '&quot;').replace(/<script/g, '<!--').replace(/<\/script>/g, '-->') + '"></iframe>';
      };
      reader.readAsText(file);
    }
  }

  function removeFile(idx) {
    delete files[idx]; delete extractedData[idx];
    var el = document.getElementById('file-' + idx);
    if (el) el.remove();
    if (selectedIndex === idx) { selectedIndex = -1; generateBtn.disabled = true; previewArea.innerHTML = '<p>Select a file to preview</p>'; }
  }

  generateBtn.addEventListener('click', function() {
    if (selectedIndex < 0 || !extractedData[selectedIndex]) return;
    progressEl.textContent = 'Generating...';
    parent.postMessage({ pluginMessage: { type: 'import', data: extractedData[selectedIndex] } }, '*');
  });

  var extractBtn = document.getElementById('extractBtn');
  extractBtn.addEventListener('click', function() {
    parent.postMessage({ pluginMessage: { type: 'extract-canvas' } }, '*');
  });

  window.onmessage = function(event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'canvas-data') {
      if (msg.error) {
        console.error('[Canvas Extract Error]', msg.error);
      } else {
        console.log('[CANVAS-DATA]', JSON.stringify(msg.data, null, 2));
      }
    }
    if (msg.type === 'doneLoading') {
      progressEl.textContent = 'Done!';
      setTimeout(function() { progressEl.textContent = ''; }, 3000);
    }
  };

  closeBtn.addEventListener('click', function() {
    parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
  });
  </script>
</body>
</html>
