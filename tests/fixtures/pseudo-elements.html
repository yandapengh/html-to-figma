<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo element regression fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef4ff; }
      .surface { width: 240px; height: 180px; position: relative; isolation: isolate; background: #ffffff; }
      .surface::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background: radial-gradient(circle at 85% 10%, rgba(120, 190, 255, 0.7), transparent 34%), linear-gradient(#155eb8, #d9efff);
        filter: saturate(0.5);
      }
      .surface::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(120deg, rgba(255, 255, 255, 0.1), transparent 70%);
      }
      .content { width: 100%; height: 100%; position: relative; display: grid; place-items: center; }
      .glow { width: 80px; height: 60px; position: relative; }
      .glow::before {
        content: "";
        width: 60px;
        height: 30px;
        position: absolute;
        left: 10px;
        top: 15px;
        border-radius: 50%;
        background: rgba(90, 185, 255, 0.45);
        filter: blur(12px);
      }
    </style>
  </head>
  <body>
    <main class="surface">
      <div class="content"><div class="glow"></div></div>
    </main>
  </body>
</html>
